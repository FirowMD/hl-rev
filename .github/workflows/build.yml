name: Build bytesto4t

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout main code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install
        working-directory: bytesto4t

      - name: Check frontend
        run: deno task check
        working-directory: bytesto4t

      - name: Build hlbc
        run: cargo build --release
        working-directory: bytesto4t/external/hlbc

      - name: Build Bytesto4t
        run: deno task tauri build
        working-directory: bytesto4t
    
      - name: Stage release artifact
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: bytesto4t-windows
          path: |
            bytesto4t/src-tauri/target/release/bundle/msi/*.msi
            bytesto4t/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: bytesto4t-windows
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
