[package]
name = "bytesto4t"
version = "0.2.4"
description = "GUI app based on hlbc"
authors = ["FirowMD"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bytesto4t_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hlbc = { path = "../external/hlbc/crates/hlbc" }
hlbc-decompiler = { path = "../external/hlbc/crates/decompiler" }
chrono = "0.4.45"
dirs = "6.0.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-log = "2.9.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.104"
prism-mcp-rs = { version = "2.0.1", features = ["stdio"] }
async-trait = "0.1.91"
