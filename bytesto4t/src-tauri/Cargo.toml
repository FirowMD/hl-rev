[package]
name = "bytesto4t"
version = "0.2.5"
description = "GUI app based on hlbc"
authors = ["FirowMD"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bytesto4t_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hlbc = { path = "../external/hlbc/crates/hlbc" }
hlbc-decompiler = { path = "../external/hlbc/crates/decompiler" }
chrono = "0.4.45"
dirs = "6.0.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-log = "2.9.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
anyhow = "1.0.104"
prism-mcp-rs = { version = "2.0.1", features = ["stdio"] }
async-trait = "0.1.91"
reqwest = { version = "0.13.1", features = ["json", "stream", "form", "socks"] }
futures-util = "0.3.31"
sha2 = "0.10.9"
base64 = "0.23.1"
rand = "0.9.2"
url = "2.5.8"
open = "5.3.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
chacha20poly1305 = "0.11.0"
regex = "1.12.3"
zeroize = "1.8.2"
tempfile = "3.23.0"
